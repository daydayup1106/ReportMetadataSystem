# ===========================================================================
# Report Migration - Production Profile
# ===========================================================================
# Activate: --spring.profiles.active=prod
# Production values should come from environment variables or deployment config.
# ===========================================================================

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://mongodb:27017/report_migration}
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 3s

logging:
  level:
    root: INFO
    com.luoyu.report: INFO
    org.springframework.data.mongodb: WARN
    org.springframework.web: WARN
    io.milvus: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized

springdoc:
  swagger-ui:
    enabled: false

app:
  llm:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      model-name: ${LLM_MODEL:claude-sonnet-4-20250514}
      timeout: 30s
      max-retries: 1

  embedding:
    base-url: ${EMBEDDING_SERVICE_URL:http://embedding-service:8001}
    timeout: 10s
    max-retries: 2

  milvus:
    host: ${MILVUS_HOST:milvus}
    port: ${MILVUS_PORT:19530}

  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket-name: ${MINIO_BUCKET:report-migration}
